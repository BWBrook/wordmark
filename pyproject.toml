[project]
name = "wordmark"
version = "0.1.0"
description = "CLI-first DOCX review tooling for comments and tracked changes"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "typer>=0.12,<1",
  "lxml>=5.2,<6",
  "PyYAML>=6,<7",
  "Pillow>=10,<12",
  "python-docx>=1.2,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<6",
  "ruff>=0.11,<1",
]

[project.scripts]
wordmark = "wordmark.cli:app"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "external_tools: tests that depend on host-installed external tools",
  "rendering: tests that require soffice and pdftoppm",
  "uno: tests that require system UNO bindings",
  "manuscript_build: tests that require quarto",
  "github_integration: tests that exercise gh-based manuscript review ingestion",
]

[tool.coverage.run]
source = ["wordmark"]
omit = ["src/wordmark/_resources/*"]

[tool.coverage.report]
skip_covered = true
show_missing = true

[tool.ruff]
target-version = "py314"
