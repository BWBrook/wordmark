name: external-tools

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

jobs:
  test-external:
    name: external-tools (ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2.2.0

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice python3-uno poppler-utils

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Run external-tools test lane
        run: make test-external
